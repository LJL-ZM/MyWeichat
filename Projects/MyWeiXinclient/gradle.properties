# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 关键修复：指定 Android Studio 自带的完整 JDK 21 作为 Gradle JDK。
# 否则 Gradle 会误用 Trae 的 redhat.java 扩展自带的 JRE 21（仅 JRE，缺少 jlink.exe），
# 导致 :app:compileDebugJavaWithJavac 阶段报 "jlink executable ... does not exist"。
# 该路径为 Android Studio 安装目录 D:\Android\Studio\jbr，含完整 JDK（含 jlink.exe）。
org.gradle.java.home=D:\\Android\\Studio\\jbr

# 配合 gradle-daemon-jvm.properties 的 toolchainVersion=21：
# 显式注册 Android Studio JBR 为 toolchain 候选（优先级高于 auto-detect），
# 避免 Gradle 又选中 Trae 扩展自带的残缺 JRE 21。
# 同时禁止自动下载，确保只使用本机已存在的完整 JDK。
org.gradle.java.installations.paths=D:\\Android\\Studio\\jbr
org.gradle.java.installations.auto-download=false
# 关键：禁用 toolchain 自动检测。否则 Gradle 会扫描系统，
# 发现 Trae 扩展自带的残缺 JRE 21（bin 有 javac 等被误判为 JDK，
# 但缺 jlink/jdk.jlink 模块），优先选它导致 JdkImageTransform 失败。
# 禁用后只使用上面 installations.paths 指定的 AS JBR。
org.gradle.java.installations.auto-detect=false
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
